tags:
  - Contacts
summary: Update contact
operationId: patchContact
description: 'Update a contact with payload'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '686cedb79c0975ec46821a94'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Wick'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+384568226732'
          email:
            description: "Contact's email"
            type: string
            format: email
            example: JohnWick@gmail.com
          isFavourite:
            description: "Contact's favourite status"
            type: boolean
            example: false
          contactType:
            description: "Contact's type. Should be one of 'work', 'home' or 'personal'"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Contac's photo"
            type: string
            format: binary
responses:
  '200':
    description: Updates a contact with payload
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml

tags:
  - Auth
summary: Refresh session
operationId: refreshSession
description: >
  Refreshes a user's session using the `refreshToken` stored in cookies.
  Returns a new access token in the response body and sets a new `refreshToken` and `sessionId` as HTTP-only cookies.
security: []
requestBody:
  description: This endpoint does not accept a request body.
  required: false
  content: {}

responses:
  '200':
    description: Successfully refreshed session and issued new access token
    headers:
      Set-Cookie:
        description: >
          Sets new `refreshToken` and `sessionId` cookies for the refreshed session.
          Cookies are HTTP-only and expire in 1 day.
        schema:
          type: string
        example: refreshToken=XuP456; HttpOnly; Path=/; Expires=Thu, 13 July 2025 14:00:00 GMT
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: RckKdwW5XMqaHRbeizKMb/bysFk4Um44+BHuYJjx
  '401':
    $ref: '../../../components/responses/401.yaml'
